# docker compose up -d --build
# Settings go in a .env file next to this one. All are optional; the defaults fit
# the first user on Ubuntu 24.04:
#   TABLINK_ARGS=--position left       host options
#   TABLINK_UID=1000  TABLINK_GID=1000  your desktop user: id -u / id -g
#   RENDER_GID=992  VIDEO_GID=44  PLUGDEV_GID=46   getent group render video plugdev
services:
  # Build-only: an image holding just the APK, consumed by the host image below.
  app:
    build:
      context: android
      secrets: [debug_keystore]
    image: tablink-app
    scale: 0                   # built, never started (a profile would hide its build secret)
    network_mode: none

  tablink:
    build:
      context: host
      additional_contexts:
        app: service:app       # COPY --from=app in host/Dockerfile
    image: tablink
    command: ${TABLINK_ARGS:-}
    restart: unless-stopped
    logging:                   # Docker keeps logs forever by default; cap them at 3 × 10 MB
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    init: true                 # forwards stop signals and reaps adb's child processes
    network_mode: host         # loopback port 27183 for `adb reverse`, and the adb server on 5037
    user: "${TABLINK_UID:-1000}:${TABLINK_GID:-1000}"   # D-Bus checks the uid
    security_opt:
      - apparmor=unconfined    # Docker's default AppArmor profile blocks talking to the session D-Bus
    group_add:
      - "${VIDEO_GID:-44}"      # /dev/dri/card*
      - "${RENDER_GID:-992}"    # /dev/dri/renderD*; varies between machines
      - "${PLUGDEV_GID:-46}"    # USB access to the tablet
    devices:
      - /dev/dri:/dev/dri      # VAAPI hardware encoding
    device_cgroup_rules:
      - "c 189:* rmw"          # USB devices, including ones plugged in after start
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      # The desktop session: D-Bus (Mutter APIs) and PipeWire (the screen video).
      - type: bind
        source: /run/user/${TABLINK_UID:-1000}/bus
        target: /run/tablink/bus
        bind: { create_host_path: false }
      - type: bind
        source: /run/user/${TABLINK_UID:-1000}/pipewire-0
        target: /run/tablink/pipewire-0
        bind: { create_host_path: false }
      # Reuse the desktop's adb key so the tablet doesn't ask to authorize a new computer.
      - ${HOME}/.android:/home/tablink/.android

secrets:
  debug_keystore:
    file: ${HOME}/.android/debug.keystore   # signs the app; see android/Dockerfile
