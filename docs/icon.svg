<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338CA"/><stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <g transform="translate(0 2.5)">
    <!-- one window spanning both screens: left part in the monitor, right part in the tablet -->
    <path d="M57 46 H43.5 a1.5 1.5 0 0 0 -1.5 1.5 V56.5 a1.5 1.5 0 0 0 1.5 1.5 H57 Z" fill="#5EEAD4"/>
    <path d="M64.5 46 H73.5 a1.5 1.5 0 0 1 1.5 1.5 V56.5 a1.5 1.5 0 0 1 -1.5 1.5 H64.5 Z" fill="#5EEAD4"/>
    <path d="M57 46 H43.5 a1.5 1.5 0 0 0 -1.5 1.5 V49 H57 Z" fill="#CCFBF1"/>
    <path d="M64.5 46 H73.5 a1.5 1.5 0 0 1 1.5 1.5 V49 H64.5 Z" fill="#CCFBF1"/>
    <!-- monitor -->
    <rect x="25.5" y="35.5" width="33" height="25" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M42 62 v4.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M36 67.5 h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <!-- tablet -->
    <rect x="63" y="44.5" width="20.5" height="16" rx="2.6" fill="none" stroke="#fff" stroke-width="3"/>
    <!-- cable: tablet bottom -> monitor base -->
    <path d="M73.2 62 v2.5 a3 3 0 0 1 -3 3 H48" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
